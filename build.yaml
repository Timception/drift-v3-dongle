# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
#
#include:
#  - board: nice_nano//zmk
#    shield: drift_central_dongle dongle_display
#    snippet: studio-rpc-usb-uart
#    artifact-name: drift_central_dongle
#  - board: nice_nano//zmk
#    shield: drift_left_central
#    snippet: studio-rpc-usb-uart
#    artifact-name: drift_left_central
#  - board: nice_nano//zmk
#    shield: drift_left    
#    artifact-name: drift_left  
#  - board: nice_nano//zmk
#    shield: drift_right
#    artifact-name: drift_right
#  - board: nice_nano//zmk
#    shield: settings_reset
---
include:
  - board: nice_nano//zmk
    shield: drift_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: drift_central_dongle
  - board: nice_nano//zmk
    shield: drift_left    
    artifact-name: drift_left  
  - board: nice_nano//zmk
    shield: drift_right
    artifact-name: drift_right
  - board: nice_nano//zmk
    shield: settings_reset